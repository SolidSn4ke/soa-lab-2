name: soa-lab

services:
  front:
    build:
      context: ./front
    image: front:local
    ports:
      - 4200:80
    depends_on:
      - labwork-service

  discipline-service:
    build:
      context: ./discipline-service
    image: discipline-service:local
    ports:
      - 42701:8443
    volumes:
      - type: bind
        source: ./docker/jetty/tls
        target: /var/lib/jetty/tls
        read_only: true
        bind:
          create_host_path: false
    environment:
      LABWORK_SERVICE_BASE_URL: http://labwork-service:8080/labwork-service
    depends_on:
      - labwork-service

  labwork-service:
    build:
      context: ./labwork-service
    image: labwork-service:local
    ports:
      - 42700:8443
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://pg:5432/labworks}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - type: bind
        source: ./docker/wildfly/configuration
        target: /opt/jboss/wildfly/standalone/configuration
        bind:
          create_host_path: false
    depends_on:
      pg:
        condition: service_healthy

  pg:
    image: postgres:latest
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-labworks}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
