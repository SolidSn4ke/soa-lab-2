name: soa-lab

services:
  labwork-service:
    build:
      context: ./labwork-service
    image: labwork-service:local
    ports:
      - 8080:8080
    depends_on:
      pg:
        condition: service_healthy

  pg:
    image: postgres:latest
    ports:
      - 5433:5432
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=labworks
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d labworks" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
