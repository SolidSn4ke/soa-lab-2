name: soa-lab

services:
  front:
    build:
      context: ./front
    image: front:local
    ports:
      - 4200:80
    depends_on:
      - labwork-service

  discipline-service:
    build:
      context: ./discipline-service
    image: discipline-service:local
    ports:
      - 8081:8080
    environment:
      LABWORK_SERVICE_BASE_URL: http://labwork-service:8080/labwork-service
    depends_on:
      - labwork-service
  
  labwork-service:
    build:
      context: ./labwork-service
    image: labwork-service:local
    ports:
      - 42700:8443
    volumes:
      - type: bind
        source: ./docker/wildfly/configuration
        target: /opt/jboss/wildfly/standalone/configuration
        bind:
          create_host_path: false
    depends_on:
      pg:
        condition: service_healthy

  pg:
    image: postgres:latest
    ports:
      - 5433:5432
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=labworks
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d labworks" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
