<section class="background-alternative">
    <div class="container">
        <h2>Filters</h2>

        <div class="filter-list default-text">
            @for (filter of filters; track $index; let i = $index) {
            <div class="filter-item">
                <select [(ngModel)]="filter.field" (ngModelChange)="onFieldChange(filter)">
                    @for (field of fields; track field.value) {
                    <option [value]="field.value">
                        {{ field.label }}
                    </option>
                    }
                </select>

                <select [(ngModel)]="filter.operator">
                    @for (operator of getOperators(filter.field); track operator.value) {
                    <option [value]="operator.value">
                        {{ operator.label }}
                    </option>
                    }
                </select>

                @if (getField(filter.field)?.type === 'select') {
                <select [(ngModel)]="filter.value">
                    <option value="">Select value</option>
                    @for (option of getField(filter.field)?.options ?? []; track option.value) {
                    <option [value]="option.value">
                        {{ option.label }}
                    </option>
                    }
                </select>
                } @else {
                <input [(ngModel)]="filter.value" [type]="getField(filter.field)?.type === 'number' ? 'number'
                : getField(filter.field)?.type === 'date' ? 'date' : 'text'" placeholder="Value" />
                }

                <button type="button" class="button button--red" (click)="removeFilter(i)">
                    Remove
                </button>
            </div>
            }
        </div>

        <div class="default-text filter__actions">
            <button type="button" class="button button--surface" (click)="addFilter()">
                + Add filter
            </button>

            <button type="button" class="button button--primary" (click)="applyFilters()">
                Apply filters
            </button>
        </div>
    </div>
</section>
