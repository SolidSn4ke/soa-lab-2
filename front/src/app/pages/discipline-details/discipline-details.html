<section>
    <div class="container">
        @if (isFormOpen){
        <app-discipline-form [discipline]="disciplineDetails()" (saved)="onDisciplineSaved()" (closed)="closeForm()" />
        }

        @if (!disciplineDetails()){
        <div class="loading">
            <span class="loading__circle"></span>
            <span class="loading__text small-text">
                Loading...
            </span>
        </div>
        }

        @else {
        <h1>{{ disciplineDetails()?.name }}</h1>
        <div class="labwork-details__info default-text">
            <span>labsCount:</span>
            <span> {{ disciplineDetails()?.labsCount }} </span>

        </div>
        <div class="labwork-details__actions">
            <button class="button button--primary default-text labwork-details__actions--edit" (click)="onEditClick()">
                Edit
            </button>
            <button class="button button--red default-text labwork-details__actions--delete" (click)="onDeleteClick()">
                Delete
            </button>
        </div>

        <div class="funny-actions default-text">
            <button class="button button--secondary funny-button" (click)="onMakeHardcoreClick()">
                Make Hardcore
            </button>
        </div>
        }
    </div>
</section>
